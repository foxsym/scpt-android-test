name: Build SCPT test APK

'on':
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out this private project
        uses: actions/checkout@v4

      - name: Check out J2ME Loader upstream
        uses: actions/checkout@v4
        with:
          repository: nikita36078/J2ME-Loader
          path: J2ME-Loader
          submodules: recursive

      - name: Configure JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Use preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "Android SDK: $ANDROID_SDK_ROOT"
          ls "$ANDROID_SDK_ROOT/platforms"

      - name: Prepare Splinter Cell game
        run: |
          python3 prepare_port.py J2ME-Loader SC-PT_E1000_EN_102.jar
          sed -i "s/apkName.toLowerCase()/apkName.toLowerCase().replace('-', '_')/" J2ME-Loader/app/build.gradle

      - name: Build standalone debug APK
        working-directory: J2ME-Loader
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleMidletDebug --stacktrace

      - name: Upload APK and build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scpt-test-apk
          path: |
            J2ME-Loader/app/build/outputs/apk/midlet/debug/*.apk
            J2ME-Loader/app/build/reports/**
          if-no-files-found: warn
